<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>SwampForce — Under Construction</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: Georgia, "Times New Roman", serif;
      background: #f7f7f5; color: #1a2744;
      padding: 1.5rem;
    }
    .card {
      max-width: 34rem; width: 100%; background: #fff; border: 1px solid #d8dde8;
      border-radius: 12px; padding: 2.25rem 2rem; text-align: center;
      box-shadow: 0 8px 28px rgba(26, 39, 68, 0.08);
    }
    .mark {
      display: inline-flex; align-items: center; gap: 0.5rem;
      font-family: system-ui, -apple-system, sans-serif; font-weight: 700;
      letter-spacing: 0.02em; color: #1a2744; margin-bottom: 1.25rem;
    }
    .bars { width: 1.1rem; height: 0.85rem; background:
      linear-gradient(#9b1c1c 0 33%, #fff 33% 66%, #1a2744 66%);
      border: 1px solid #1a2744; border-radius: 2px;
    }
    h1 {
      font-size: 1.75rem; line-height: 1.25; margin: 0 0 0.75rem;
    }
    .badge {
      display: inline-block; font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.75rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
      color: #9b1c1c; border: 1px solid #9b1c1c; border-radius: 999px;
      padding: 0.25rem 0.7rem; margin-bottom: 1rem;
    }
    p {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 1rem; line-height: 1.55; color: #3a455c; margin: 0;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark"><span class="bars" aria-hidden="true"></span> SwampForce</div>
    <div class="badge">Under construction</div>
    <h1>We're rebuilding this site.</h1>
    <p>SwampForce documents false and misleading claims about Trump and his administration, each tied to a public record. The new pages will be up shortly.</p>
  </main>
</body>
</html>
